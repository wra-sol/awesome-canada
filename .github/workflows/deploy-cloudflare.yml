name: Deploy Site to Cloudflare Pages (manual fallback)

# Day-to-day deploys are handled by Cloudflare Pages' git-connected builds —
# Cloudflare watches this repo and builds on every push (see
# docs/DEPLOYMENT.md). This workflow is a manual fallback for when the git
# connection is unavailable.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate data
        run: node scripts/validate.js

      - name: Build site
        run: node scripts/build-site.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=awesome-canada --branch=master
